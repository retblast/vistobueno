- id: numeracion_posicion
  tipo: presencia_xml
  descripcion: La numeración de página se ubica en el margen inferior derecho
  valor_esperado: margen inferior derecho
  severidad: error
  ubicacion: Sección "Formato general" (párr. 137-138)
  fuente: MANUAL REVISADO TERCERA VERSION OBSERVACIONES 11-07-2025.docx
  cita: '"Numeración de la página: Margen inferior derecho."'
