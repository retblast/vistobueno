  severidad: warning
  ubicacion: 'Sección Resumen (párr. 201)'
  fuente: MANUAL REVISADO TERCERA VERSION OBSERVACIONES 11-07-2025.docx
  cita: '"Su extensión mínima 159 y su extensión máxima..."'
  patron_cantidad:
