  - parte: document
    contexto: todos
    xpath: //w:sectPr[1]/w:footerReference
    comparacion: exists
  - parte: footer
    contexto: todos
    xpath: //w:instrText[contains(., 'PAGE')]
    comparacion: exists
  atributo_xml:
    parte: footer
    contexto: todos
    xpath: //w:p/w:pPr/w:jc
    atributo: '@w:val'
    comparacion: eq
    esperado: right
- id: numeracion_preliminares_romano
  tipo: atributo_xml
  descripcion: Las páginas preliminares se numeran en romanos minúsculos; la carátula no se enumera pero
    se cuenta; la Dedicatoria inicia con "ii"
  valor_esperado: romanos minúsculos (ii, iii, iv...); carátula = i (sin mostrar)
  severidad: error
  ubicacion: Sección "Formato general" (párr. 139)
  fuente: MANUAL REVISADO TERCERA VERSION OBSERVACIONES 11-07-2025.docx
  cita: '"Las páginas preliminares son numeradas en romanos minúscula en orden correlativo; la carátula
    no se enumera, pero se cuenta y se inicia enumerando la página de Dedicatoria con dos ("ii") en romano..."'
  atributo_xml:
    parte: document
    contexto: todos
    xpath: (//w:sectPr)[position() < last()]/w:pgNumType
    atributo: '@w:fmt'
    comparacion: all_eq
    esperado: lowerRoman
- id: numeracion_cuerpo_arabigo
  tipo: presencia_xml
  descripcion: La numeración en arábigos se inicia en la Introducción, continuando el correlativo desde
    los romanos
  valor_esperado: arábigos consecutivos desde Introducción
  severidad: error
  ubicacion: Sección "Formato general" (párr. 140)
  fuente: MANUAL REVISADO TERCERA VERSION OBSERVACIONES 11-07-2025.docx
  cita: '"La numeración en arábigos se inicia en la introducción contando el número de páginas en romanos
    (por ejemplo, si la numeración de las páginas preliminares termina en "xi", corresponde a la primera
    página de la Introducción el número 12)."'
  presencia_xml:
    parte: document
    contexto: todos
    xpath: (//w:sectPr)[position() = last()]/w:pgNumType
    comparacion: not_exists
