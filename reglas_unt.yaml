    parte: document
    contexto: cuerpo
    xpath: //w:body//w:p[w:pPr/w:jc]/w:pPr/w:jc
    atributo: '@w:val'
    comparacion: all_eq
    esperado: both
- id: alineacion_caratula_todos_elementos
  tipo: atributo_xml
  descripcion: Todos los elementos de la carátula deben estar centrados
  valor_esperado: centrado
  severidad: error
  ubicacion: Carátula, especificaciones (párr. 174-183)
  fuente: MANUAL REVISADO TERCERA VERSION OBSERVACIONES 11-07-2025.docx
  cita: '"Nombre de la Universidad: Centrado...", "Facultad y Escuela Profesional: Centrado...", "Título
    del Trabajo...: Centrado...", etc.'
  atributo_xml:
    parte: document
    contexto: todos
    xpath: //w:body/w:p[contains(translate(normalize-space(.), 'ABCDEFGHIJKLMNOPQRSTUVWXYZÁÉÍÓÚÑÜ', 'abcdefghijklmnopqrstuvwxyzáéíóúñü'),
      'universidad') or (contains(translate(normalize-space(.), 'ABCDEFGHIJKLMNOPQRSTUVWXYZÁÉÍÓÚÑÜ', 'abcdefghijklmnopqrstuvwxyzáéíóúñü'),
      'facultad') or contains(translate(normalize-space(.), 'ABCDEFGHIJKLMNOPQRSTUVWXYZÁÉÍÓÚÑÜ', 'abcdefghijklmnopqrstuvwxyzáéíóúñü'),
      'programa') or contains(translate(normalize-space(.), 'ABCDEFGHIJKLMNOPQRSTUVWXYZÁÉÍÓÚÑÜ', 'abcdefghijklmnopqrstuvwxyzáéíóúñü'),
      'escuela')) or contains(translate(normalize-space(.), 'ABCDEFGHIJKLMNOPQRSTUVWXYZÁÉÍÓÚÑÜ', 'abcdefghijklmnopqrstuvwxyzáéíóúñü'),
      'para optar') or starts-with(translate(normalize-space(.), 'ABCDEFGHIJKLMNOPQRSTUVWXYZÁÉÍÓÚÑÜ',
      'abcdefghijklmnopqrstuvwxyzáéíóúñü'), 'autor') or contains(translate(normalize-space(.), 'ABCDEFGHIJKLMNOPQRSTUVWXYZÁÉÍÓÚÑÜ',
      'abcdefghijklmnopqrstuvwxyzáéíóúñü'), 'asesor') or contains(translate(normalize-space(.), 'ABCDEFGHIJKLMNOPQRSTUVWXYZÁÉÍÓÚÑÜ',
      'abcdefghijklmnopqrstuvwxyzáéíóúñü'), 'mención') or contains(translate(normalize-space(.), 'ABCDEFGHIJKLMNOPQRSTUVWXYZÁÉÍÓÚÑÜ',
      'abcdefghijklmnopqrstuvwxyzáéíóúñü'), 'trujillo')]/w:pPr/w:jc
    atributo: '@w:val'
    comparacion: all_eq
    esperado: center
- id: margen_superior
  tipo: atributo_xml
  descripcion: Margen superior del documento
  valor_esperado: 2.5 cm
  severidad: error
  ubicacion: Sección "Formato general" (párr. 132-133)
