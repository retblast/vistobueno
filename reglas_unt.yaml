  descripcion: La primera línea de cada párrafo debe tener sangría de 1.27 cm
  valor_esperado: 1.27 cm (½ pulgada)
  severidad: warning
  ubicacion: Sección "Formato general" (párr. 141)
  fuente: MANUAL REVISADO TERCERA VERSION OBSERVACIONES 11-07-2025.docx
  cita: '"Sangría de párrafo: La primera línea de cada párrafo del texto debe tener un sangrado de 1,27
