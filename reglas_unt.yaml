# ============================================================
# REGLAS UNT EN FORMATO DSL — GENERADO POR scripts/migrar_legacy_a_dsl.py
# ------------------------------------------------------------
# Migración de `unt_format_rules_schema.yaml` (formato legacy) al
# formato declarativo (Fase F1 del PLAN_DSL). Desde la F5 la API
# (`api.py`) carga ESTE archivo y las reglas F3 mecanizadas a mano.
# Se usa para el test de paridad legacy-vs-DSL y como base de las
# fases siguientes (unificación de YAML, F3).
# ============================================================

version: "2026-09-01"
namespaces:
  w: http://schemas.openxmlformats.org/wordprocessingml/2006/main
  r: http://schemas.openxmlformats.org/officeDocument/2006/relationships
  a: http://schemas.openxmlformats.org/drawingml/2006/main
  pic: http://schemas.openxmlformats.org/drawingml/2006/picture
reglas:
# Regla discriminadora. Corre en fase 1 y publica `tipo_documento` en el
# contexto; las reglas de estructura la consultan con `aplicar_si`.
# Es `warning` y siempre informa: no bloquea la entrega (decisión 4 del
# diseño, docs/diseno/15_tipo_documento_grupos.md).
- id: deteccion_tipo_documento
  tipo: deteccion
  descripcion: Determina a qué tipo de documento pertenece la tesis
  valor_esperado: >-
    uno de: tinv_cuantitativo, tinv_cualitativo, tinv_revision_literatura,
    proyecto_cuantitativo, proyecto_cualitativo, informe_cuantitativo,
    informe_cualitativo, tsp
  severidad: warning
  ubicacion: 'Capítulo II — esquemas formales por tipo de título (párr. 75-90)'
  fuente: MANUAL REVISADO TERCERA VERSION OBSERVACIONES 11-07-2025.docx
  cita: 'Cada título profesional exige un esquema formal distinto'
  deteccion_tipo:
    expone: tipo_documento
    declaracion:
      anexo: 'Anexo 10 — Declaración jurada (párr. 5008-5022)'
      # El manual usa DOS vocabularios distintos y no son intercambiables:
      #
      # 1. El del TÍTULO que se opta, que aparece en los encabezados de cada
      #    capítulo ("TESIS PARA OBTENER EL TÍTULO PROFESIONAL EN
      #    INVESTIGACIÓN CUANTITATIVA").
      # 2. El del FORMULARIO del Anexo 10 (párr. 5014-5016), donde el autor
      #    marca una casilla y lo que aparece impreso es "TRABAJO DE
      #    INVESTIGACIÓN CUANTITATIVO".
      #
      # Se listan los dos porque la declaración se lee del Anexo 10, y lo que
      # se encuentra ahí escrito es el segundo. El primero se conserva por si
      # el autor transcribe el título en lugar de marcar la casilla.
      #
      # La casilla (símbolo, texto plano o content-control w14) puede vivir en
      # cualquier párrafo del cuerpo, dentro de una tabla o de un w:sdt; si es
      # una tabla, la etiqueta se busca en la MISMA fila (revisión del PR #45).
      etiquetas:
        # EVALUADO: el manual llama a este tipo "Trabajo de Suficiencia
        # Profesional" (párr. 89, 3430). Las dos etiquetas siguientes no
        # aparecen en ninguna parte del manual; se conservan porque la
        # facultad las usa en la practica.
        tsp: ['TRABAJO DE SUFICIENCIA PROFESIONAL', 'TRABAJO DE SERVICIO', 'SERVICIO SOCIAL']
        # El Anexo 10 no ofrece casillas propias para el informe (solo el
        # encabezado "INFORME DEL PROYECTO", párr. 5018), asi que estas dos
        # etiquetas solo se pueden dar por el titulo o por las firmas.
        informe_cuantitativo: ['INFORME DE PROYECTO DE INVESTIGACIÓN CUANTITATIVO']
        informe_cualitativo: ['INFORME DE PROYECTO DE INVESTIGACIÓN CUALITATIVO']
        proyecto_cuantitativo: ['PROYECTO DE INVESTIGACIÓN CUANTITATIVO']
        proyecto_cualitativo: ['PROYECTO DE INVESTIGACIÓN CUALITATIVO']
        tinv_revision_literatura:
          - 'TESIS PARA OBTENER EL GRADO DE BACHILLER EN INVESTIGACIÓN'
          - 'TRABAJO DE INVESTIGACIÓN DE REVISIÓN DE LA LITERATURA'
        tinv_cualitativo:
          - 'TESIS PARA OBTENER EL TÍTULO PROFESIONAL EN INVESTIGACIÓN CUALITATIVA'
          - 'TRABAJO DE INVESTIGACIÓN CUALITATIVO'
        tinv_cuantitativo:
          - 'TESIS PARA OBTENER EL TÍTULO PROFESIONAL EN INVESTIGACIÓN CUANTITATIVA'
          - 'TRABAJO DE INVESTIGACIÓN CUANTITATIVO'
    # En orden de especificidad (decisión 2): gana el primero que alcance su
    # mínimo. El informe es la versión revisada del proyecto, así que sus
    # firmas son más específicas y se evalúan antes.
    #
    # Las firmas se cotejan SOLO contra párrafos con estilo de título, igual
    # que el DFA de estructura (revisión del PR #45). La prosa no cuenta como
    # evidencia: la línea "Línea de investigación:" de la carátula está en
    # toda tesis, pero no es un título, así que no debe alcanzar el mínimo de
    # proyecto en un documento que no lo es.
    firmas:
    - tipo: tsp
      evidencia: ['SECUENCIA DIDÁCTICA', 'SUSTENTO PSICOPEDAGÓGICO', 'SUSTENTO TEÓRICO CIENTÍFICO']
      minimo: 2
    # `minimo: 3` (las tres): 'PARTICIPANTES' e 'INSTRUMENTOS USADOS EN LA
    # RECOLECCIÓN' también son secciones del TINV cualitativo, así que con
    # `minimo: 2` una tesis cualitativa se detectaba como informe y se
    # quedaba SIN validación estructural. Lo que separa al informe es
    # 'SITUACIÓN PROBLEMATIZADA', que el TINV no trae.
    - tipo: informe_cualitativo
      evidencia: ['SITUACIÓN PROBLEMATIZADA', 'PARTICIPANTES', 'INSTRUMENTOS USADOS EN LA RECOLECCIÓN']
      minimo: 3
    - tipo: informe_cuantitativo
      evidencia: ['SITUACIÓN PROBLEMATIZADA', 'DISEÑO DE CONTRASTACIÓN', 'OPERACIONALIZACIÓN DE LAS VARIABLES']
      minimo: 2
    - tipo: proyecto_cuantitativo
      evidencia: ['PLAN DE INVESTIGACIÓN', 'RECURSOS Y MATERIALES', 'LÍNEA DE INVESTIGACIÓN']
      minimo: 2
    - tipo: proyecto_cualitativo
      evidencia: ['SELECCIÓN DE PARTICIPANTES', 'ESCENARIO', 'UNIDAD DE ANÁLISIS']
      minimo: 2
    # Firma derivada de `estructura_tinv_revision_literatura`: las dos
    # secciones que SOLO tiene una revisión. 'ESTADO DEL ARTE' no sirve como
    # firma por sí solo (aparece en el marco teórico de cualquier tesis), por
    # eso el umbral es 2: revisión tiene methodology+desarrollo, una tesis
    # empírica sólo tiene el estado del arte.
    - tipo: tinv_revision_literatura
      evidencia: ['METODOLOGÍA DE REVISIÓN', 'DESARROLLO O ANÁLISIS CRÍTICO DE LA LITERATURA', 'ESTADO DEL ARTE']
      minimo: 2
    # Evidencia derivada de `estructura_tinv_cualitativo`: las secciones que
    # ese esquema tiene y el cuantitativo NO. Con 'DEFINICIÓN DE TÉRMINOS' /
    # 'CATEGORIZACIÓN' la firma solo alcanzaba 1 de 2 en su propio esquema.
    - tipo: tinv_cualitativo
      evidencia:
      - 'MATRIZ DE CATEGORIZACIÓN'
      - 'ESTRATEGIAS USADAS EN EL ANÁLISIS'
      - 'ANÁLISIS Y DISCUSIÓN DE RESULTADOS'
      minimo: 2
    # `minimo: 2`: 'INSTRUMENTO' también casa con "Instrumentos usados en la
    # recolección" del esquema cualitativo. Con 1 una tesis cualitativa
    # alcanzaría esta firma. Las plantillas oficiales dan 2 de 3.
    - tipo: tinv_cuantitativo
      evidencia: ['VARIABLE', 'POBLACIÓN Y MUESTRA', 'INSTRUMENTO']
      minimo: 2
    minimo_global: 1
- id: papel_tamano
  tipo: atributo_xml
  descripcion: El tamaño del papel debe ser A4
  valor_esperado: 210 x 297 mm
  severidad: error
  ubicacion: Sección "Formato general" (párr. 124-125 para Trabajo de Investigación Cuantitativo; se repite
    idéntico en párr. 443-444, 593-594 para otros tipos)
  fuente: MANUAL REVISADO TERCERA VERSION OBSERVACIONES 11-07-2025.docx
  cita: '"Tamaño A4/papel (210x297 cm)"'
  atributo_xml:
  - parte: document
    contexto: todos
    xpath: //w:sectPr[1]/w:pgSz
    atributo: '@w:w'
    comparacion: eq
    esperado: '11906'
  - parte: document
    contexto: todos
    xpath: //w:sectPr[1]/w:pgSz
    atributo: '@w:h'
    comparacion: eq
    esperado: '16838'
