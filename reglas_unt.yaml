# ─── CARÁTULA: ORCID COMO HIPERVÍNCULO ──────────────────────

- id: caratula_orcid
  tipo: formato_texto
  descripcion: El código ORCID del autor y asesor se muestra como hipervínculo, entre paréntesis, debajo del nombre
  valor_esperado: 'https://orcid.org/XXXXXXXXXXXX'
  severidad: warning
  ubicacion: 'Carátula, especificaciones (párr. 179-180)'
  fuente: MANUAL REVISADO TERCERA VERSION OBSERVACIONES 11-07-2025.docx
  cita: '"A continuación, se consignará con minúsculas y entre paréntesis el hipervínculo del código ORCID de 16 dígitos..."'
  hipervinculo_texto:
    parte: document
    contexto: todos
    xpath: //w:body//w:hyperlink
    patron: 'https?://orcid\.org/\d{4}-?\d{4}-?\d{4}-?\d{4}'
    cantidad_minima: 1

# ─── CARÁTULA DEL PROYECTO ──────────────────────────────────
# EVALUADO: se valida la línea de tipo y su tamaño 13pt (sz val 26).
# Negrita/centrado quedan como matiz semántico; el manual no especifica
# XPath único para el párrafo exacto.

- id: proyecto_caratula_texto
  tipo: formato_texto
  descripcion: En la carátula del Proyecto, la línea de tipo dice "Proyecto de Investigación" (no "Trabajo de Investigación para optar...")
  valor_esperado: Proyecto de Investigación
  severidad: error
  ubicacion: 'Carátula del Proyecto (párr. 618, 641)'
  fuente: MANUAL REVISADO TERCERA VERSION OBSERVACIONES 11-07-2025.docx
  cita: '"Proyecto de Investigación: Centrado, con negrita y con mayúsculas (tamaño de letra, 13 puntos)."'
  patron_texto:
    parte: document
    contexto: todos
    xpath: '//w:body/w:p[contains(translate(normalize-space(.), "ABCDEFGHIJKLMNOPQRSTUVWXYZÁÉÍÓÚÑÜ", "abcdefghijklmnopqrstuvwxyzáéíóúñü"), "proyecto de investigación")]//w:t'
    patron: 'proyecto de investigación'
    coincidencia: alguno
    comparacion: regex
    ignore_case: true
  atributo_xml:
    parte: document
    contexto: todos
    xpath: '//w:body/w:p[contains(translate(normalize-space(.), "ABCDEFGHIJKLMNOPQRSTUVWXYZÁÉÍÓÚÑÜ", "abcdefghijklmnopqrstuvwxyzáéíóúñü"), "proyecto de investigación")][1]/w:r[1]/w:rPr/w:sz'
    atributo: '@w:val'
    comparacion: eq
    esperado: '26'

# ─── F3: REGLAS DOCUMENTADAS COMO NO-AUTOMATIZABLES ─────────
# - sistema_citas (APA): heurística autor-año débil, fuera de F3.
# - proyecto_formato_general: metaregla cubierta por las reglas
#   generales (A4/TNR/1.5/márgenes) que ya validan el documento entero.
# - suficiencia_profesional_formato: misma metaregla; mismo razonamiento.
_migracion:
  fuente: unt_format_rules_schema.yaml
  total_reglas: 32
  sin_mecanismo_omitidas: 12
  total_reglas_con_f3: 41
  f3_reglas_agregadas_manualmente: 9
  # 41 = 32 migradas + 9 mecanizadas a mano en la F3 (resumen_longitud,
  # palabras_clave_minimo, referencias_minimo_*, anexos_minimos_*,
  # caratula_orcid, proyecto_caratula_texto). Re-ejecutar
  # scripts/migrar_legacy_a_dsl.py regenera SOLO las 32 y descarta la F3.
  f3_no_automatizables: 3
  # sistema_citas, proyecto_formato_general, suficiencia_profesional_formato
  # quedan documentadas como no-automatizables (ver bloque F3).
