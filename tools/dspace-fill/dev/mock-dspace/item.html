<!DOCTYPE html>
<html lang="es">
<head>
	<meta charset="utf-8">
	<title>Ítem archivado (MOCK)</title>
</head>
<body>
	<h1>Ítem archivado (MOCK)</h1>
	<p>Simulación de la página del ítem tras aprobarse el envío.</p>
	<p id="titulo-item">Taller de dramatización de títeres (título de la ficha)</p>
	<p>
		URI:
		<a href="https://hdl.handle.net/20.500.14414/99999">
			https://hdl.handle.net/20.500.14414/99999
		</a>
	</p>
	<!-- Indicador PERSISTENTE (hallazgo 1): el toast del userscript dura
	     6 segundos; esto queda fijo para el operador que llega tarde. -->
	<div id="estado-reporte" style="background:#f0f4f8;border:1px solid #c0d0e0;border-radius:8px;padding:12px 16px;margin-top:16px">
		<strong>Estado del buzón:</strong>
		<span id="estado-reporte-texto" style="color:#555">Consultando…</span>
	</div>
	<!-- El userscript detecta el handle y lo reporta al buzón. -->
	<script src="/shim-gm.js"></script>
	<script src="/userscript.js"></script>
	<script>
		// Indicador persistente con reintentos (hallazgo 15): el POST del
		// userscript puede llegar después de la primera consulta; sin
		// reintentos, un "Sin depósito" falso detendría el flujo.
		(async () => {
			const el = document.getElementById("estado-reporte-texto");
			const maximos = 4;
			for (let i = 0; i < maximos; i++) {
				await new Promise((r) => setTimeout(r, 2000));
				try {
					const r = await fetch("/api-proxy/deposito");
					if (r.status === 200) {
						const d = await r.json();
						el.innerHTML = "✅ Handle reportado: <code>" + d.handle +
							"</code> · timestamp: <code>" + d.timestamp + "</code>";
						return;
					}
					if (r.status === 404 && i < maximos - 1) {
						el.textContent = "Esperando al userscript… (intento " + (i + 1) + "/" + maximos + ")";
						continue;
					}
					el.textContent = r.status === 404
						? "Sin depósito en el buzón tras " + maximos + " intentos — revisa la consola o publica la ficha de nuevo."
						: "El buzón respondió HTTP " + r.status + ".";
					return;
				} catch (e) {
					el.textContent = "No se pudo consultar el buzón (¿está la API en :8000?).";
					return;
				}
			}
		})();
	</script>
</body>
</html>
