name: VistoBueno CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main

      - name: Run tests, lint and typecheck (nix flake check)
        run: nix flake check --print-build-logs

      - name: Verify formatting (ruff format --check)
        run: nix develop --command ruff format --check validator/ scripts/ tests/

      - name: Verify OpenAPI spec is in sync
        run: nix develop --command python3 scripts/generate_openapi.py --check
