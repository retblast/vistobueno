# F3 — MECANIZACIÓN DE REGLAS ANTES NO-DETERMINISTAS (2026-09-09)
# ------------------------------------------------------------
# Reglas agregadas a MANO sobre reglas_unt.yaml. NO las emite
# scripts/migrar_legacy_a_dsl.py (solo regenera las 32 legacy);
