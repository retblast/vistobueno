# ============================================================
# REGLAS UNT EN FORMATO DSL — GENERADO POR scripts/migrar_legacy_a_dsl.py
# ------------------------------------------------------------
# Migración de `unt_format_rules_schema.yaml` (formato legacy) al
# formato declarativo (Fase F1 del PLAN_DSL). Desde la F5 la API
# (`api.py`) carga ESTE archivo y las reglas F3 mecanizadas a mano.
# Se usa para el test de paridad legacy-vs-DSL y como base de las
# fases siguientes (unificación de YAML, F3).
# ============================================================

version: "2026-09-01"
namespaces:
  w: http://schemas.openxmlformats.org/wordprocessingml/2006/main
  r: http://schemas.openxmlformats.org/officeDocument/2006/relationships
  a: http://schemas.openxmlformats.org/drawingml/2006/main
  pic: http://schemas.openxmlformats.org/drawingml/2006/picture
reglas:
- id: papel_tamano
  tipo: atributo_xml
  descripcion: El tamaño del papel debe ser A4
  valor_esperado: 210 x 297 mm
  severidad: error
  ubicacion: Sección "Formato general" (párr. 124-125 para Trabajo de Investigación Cuantitativo; se repite
    idéntico en párr. 443-444, 593-594 para otros tipos)
  fuente: MANUAL REVISADO TERCERA VERSION OBSERVACIONES 11-07-2025.docx
  cita: '"Tamaño A4/papel (210x297 cm)"'
  atributo_xml:
  - parte: document
    contexto: todos
    xpath: //w:sectPr[1]/w:pgSz
    atributo: '@w:w'
    comparacion: eq
    esperado: '11906'
  - parte: document
    contexto: todos
    xpath: //w:sectPr[1]/w:pgSz
    atributo: '@w:h'
    comparacion: eq
    esperado: '16838'
- id: fuente_principal
  tipo: atributo_xml
  descripcion: La fuente del cuerpo del texto debe ser Times New Roman
  valor_esperado: Times New Roman
  severidad: error
  ubicacion: Sección "Formato general" (párr. 126-127)
  fuente: MANUAL REVISADO TERCERA VERSION OBSERVACIONES 11-07-2025.docx
  cita: '"Times New Roman: 12 puntos"'
  atributo_xml:
    parte: document
    contexto: cuerpo
    xpath: //w:body//w:p[w:r]/w:r[1]/w:rPr/w:rFonts
    atributo: '@w:ascii'
    comparacion: all_eq
    esperado: Times New Roman
- id: tamano_cuerpo
  tipo: atributo_xml
  descripcion: El tamaño de letra del cuerpo del texto debe ser 12 puntos
  valor_esperado: 12pt
  severidad: error
  ubicacion: Sección "Formato general" (párr. 126-127)
  fuente: MANUAL REVISADO TERCERA VERSION OBSERVACIONES 11-07-2025.docx
  cita: '"Times New Roman: 12 puntos"'
  atributo_xml:
    parte: document
    contexto: cuerpo
    xpath: //w:body//w:p[w:r]/w:r[1]/w:rPr/w:sz
    atributo: '@w:val'
    comparacion: all_eq
    esperado: '24'
- id: caratula_universidad_tamano
  tipo: atributo_xml
  descripcion: Tamaño de letra del nombre de la Universidad en carátula
  valor_esperado: 18pt
  severidad: error
  ubicacion: 'Carátula, especificaciones (párr. 174); nota indicativa en párr. 153: "(Times New Román
    18 puntos/13 puntos/13 puntos)"'
  fuente: MANUAL REVISADO TERCERA VERSION OBSERVACIONES 11-07-2025.docx
  cita: '"Nombre de la Universidad: Centrado, con negrita y con mayúsculas (tamaño de letra, 18 puntos)."'
  atributo_xml:
    parte: document
    contexto: todos
    xpath: //w:body/w:p[contains(translate(normalize-space(.), 'ABCDEFGHIJKLMNOPQRSTUVWXYZÁÉÍÓÚÑÜ', 'abcdefghijklmnopqrstuvwxyzáéíóúñü'),
      'universidad')][1]/w:r[1]/w:rPr/w:sz
    atributo: '@w:val'
    comparacion: eq
    esperado: '36'
- id: caratula_facultad_escuela_tamano
  tipo: atributo_xml
  descripcion: Tamaño de letra de Facultad y Escuela Profesional en carátula
  valor_esperado: 13pt
  severidad: error
  ubicacion: Carátula, especificaciones (párr. 175)
  fuente: MANUAL REVISADO TERCERA VERSION OBSERVACIONES 11-07-2025.docx
  cita: '"Facultad y Escuela Profesional: Centrado, con negrita y con mayúsculas (tamaño de letra, 13
    puntos)."'
  atributo_xml:
    parte: document
    contexto: todos
    xpath: //w:body/w:p[(contains(translate(normalize-space(.), 'ABCDEFGHIJKLMNOPQRSTUVWXYZÁÉÍÓÚÑÜ', 'abcdefghijklmnopqrstuvwxyzáéíóúñü'),
      'facultad') or contains(translate(normalize-space(.), 'ABCDEFGHIJKLMNOPQRSTUVWXYZÁÉÍÓÚÑÜ', 'abcdefghijklmnopqrstuvwxyzáéíóúñü'),
      'programa') or contains(translate(normalize-space(.), 'ABCDEFGHIJKLMNOPQRSTUVWXYZÁÉÍÓÚÑÜ', 'abcdefghijklmnopqrstuvwxyzáéíóúñü'),
      'escuela'))][1]/w:r[1]/w:rPr/w:sz
    atributo: '@w:val'
    comparacion: eq
    esperado: '26'
- id: caratula_titulo_trabajo_tamano
  tipo: atributo_xml
  descripcion: Tamaño de letra del título del trabajo en carátula
  valor_esperado: 14pt
  severidad: warning
  ubicacion: Carátula, especificaciones (párr. 177)
  fuente: MANUAL REVISADO TERCERA VERSION OBSERVACIONES 11-07-2025.docx
  cita: '"Título del Trabajo de Investigación: Centrado, con negrita y con letras mayúsculas y minúsculas
    (tamaño de letra, 14 puntos)."'
  atributo_xml:
    parte: document
    contexto: todos
    xpath: //w:body/w:p[(contains(translate(normalize-space(.), 'ABCDEFGHIJKLMNOPQRSTUVWXYZÁÉÍÓÚÑÜ', 'abcdefghijklmnopqrstuvwxyzáéíóúñü'),
      'título del trabajo') or contains(translate(normalize-space(.), 'ABCDEFGHIJKLMNOPQRSTUVWXYZÁÉÍÓÚÑÜ',
      'abcdefghijklmnopqrstuvwxyzáéíóúñü'), 'titulo del trabajo'))][1]/w:r[1]/w:rPr/w:sz
    atributo: '@w:val'
    comparacion: eq
    esperado: '28'
- id: caratula_optar_grado_tamano
  tipo: atributo_xml
  descripcion: Tamaño de letra de la línea "Trabajo de Investigación para optar el grado de Bachiller
    en..."
  valor_esperado: 13pt
  severidad: warning
  ubicacion: Carátula, especificaciones (párr. 178)
  fuente: MANUAL REVISADO TERCERA VERSION OBSERVACIONES 11-07-2025.docx
  cita: '"Trabajo de Investigación para optar el grado de Bachiller: Centrado, con negrita y con mayúsculas
    (tamaño de letra, 13 puntos)."'
  atributo_xml:
    parte: document
    contexto: todos
    xpath: //w:body/w:p[contains(translate(normalize-space(.), 'ABCDEFGHIJKLMNOPQRSTUVWXYZÁÉÍÓÚÑÜ', 'abcdefghijklmnopqrstuvwxyzáéíóúñü'),
      'para optar')][1]/w:r[1]/w:rPr/w:sz
    atributo: '@w:val'
    comparacion: eq
    esperado: '26'
- id: caratula_autores_tamano
  tipo: atributo_xml
  descripcion: Tamaño de letra de autores, asesor, línea de investigación, ciudad y año en carátula
  valor_esperado: 12pt
  severidad: error
  ubicacion: Carátula, especificaciones (párr. 161, 168, 179-183)
  fuente: MANUAL REVISADO TERCERA VERSION OBSERVACIONES 11-07-2025.docx
  cita: '"(Times New Román 12 puntos)" para autores; "Línea de investigación, con letras mayúsculas y
    minúsculas (tamaño de letra, 12 puntos)."'
  atributo_xml:
    parte: document
    contexto: todos
    xpath: //w:body/w:p[starts-with(translate(normalize-space(.), 'ABCDEFGHIJKLMNOPQRSTUVWXYZÁÉÍÓÚÑÜ',
      'abcdefghijklmnopqrstuvwxyzáéíóúñü'), 'autor')][1]/following-sibling::w:p[1]/w:r[1]/w:rPr/w:sz
    atributo: '@w:val'
    comparacion: eq
    esperado: '24'
- id: caratula_logotipo_tamano
  tipo: imagen
  descripcion: Tamaño del logotipo de la Universidad en carátula
  valor_esperado: 4.84 cm alto x 6.73 cm ancho
  severidad: warning
  ubicacion: Carátula, especificaciones (párr. 176)
  fuente: MANUAL REVISADO TERCERA VERSION OBSERVACIONES 11-07-2025.docx
  cita: '"Logotipo de la Universidad: Centrado, tamaño: 4.84 cm de alto x 6.73 cm de ancho."'
  imagen:
    parte: document
    xpath: //w:drawing//a:blip
    formato: png
    cantidad_minima: 1
- id: interlineado
  tipo: atributo_xml
  descripcion: El interlineado del cuerpo del texto debe ser 1.5 (1.5 líneas)
  valor_esperado: 1.5 (ONE_POINT_FIVE)
  severidad: error
  ubicacion: Sección "Formato general" (párr. 128-129)
  fuente: MANUAL REVISADO TERCERA VERSION OBSERVACIONES 11-07-2025.docx
  cita: '"Interlineado: 1.5 puntos"'
  atributo_xml:
  - parte: document
    contexto: cuerpo
    xpath: //w:body//w:p[w:pPr/w:spacing]/w:pPr/w:spacing
    atributo: '@w:line'
    comparacion: all_eq
    esperado: '360'
  - parte: document
    contexto: cuerpo
    xpath: //w:body//w:p[w:pPr/w:spacing]/w:pPr/w:spacing
    atributo: '@w:lineRule'
    comparacion: all_eq
    esperado: auto
- id: alineacion_cuerpo
  tipo: atributo_xml
  descripcion: El cuerpo del texto debe estar justificado
