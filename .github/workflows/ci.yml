name: VistoBueno CI

on:
  # Push solo en master: las ramas de trabajo se verifican vía su PR.
  # Antes, cada push a una rama con PR abierto disparaba DOS runs
  # (push + pull_request) idénticos (hallazgo C8).
  push:
    branches: [master]
  pull_request:

# Un solo run vivo por rama/PR: un push nuevo cancela el run en curso
# de la misma rama en vez de encolarlo (hallazgo C8).
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Capa 3 anti-secretos: cubre el caso `git commit --no-verify`.
      # Corre antes del entorno Nix para fallar rápido. Se ancla al mismo
      # intérprete que exige el proyecto (requires-python >= 3.14): el
      # python3 del runner (3.12/3.13) no soporta la sintaxis que produce
      # ruff con target py314 (PEP 758: except sin paréntesis).
      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Escaneo de secretos SMTP
        run: python3 scripts/verificar_secretos.py --all

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v23

      - name: Run tests, lint and typecheck (nix flake check)
        run: nix flake check --print-build-logs

      - name: Verify formatting (ruff format --check)
        run: nix develop --command ruff format --check validator/ scripts/ tests/

      - name: Verify OpenAPI spec is in sync
        run: nix develop --command python3 scripts/generate_openapi.py --check

  # Build del frontend con el Node LTS del flake (fuente de verdad de
  # dependencias). Job separado para correr en paralelo con `check`.
  frontend:
    name: Build frontend (vite)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v23

      - name: Build frontend (npm ci + vite build)
        run: nix develop --command sh -c "cd frontend && npm ci && npm run build"

      # Observación de revisión (Arreglos.txt v4): toda área con
      # verificación propia debe tener su paso en CI (AGENTS.md,
      # "Protección del CI"). Aditivo: reutiliza node_modules del
      # paso anterior; no toca ni relaja ningún paso existente.
      - name: Lint frontend (eslint)
        run: nix develop --command sh -c "cd frontend && npm run lint"

      # Arreglos.txt (2026-10-12): paso extra en el mismo job. Los tests
      # del frontend (vitest) pasan a ser puerta de calidad igual que el
      # lint; reutiliza node_modules del paso de build, igual que hace el
      # lint. Aditivo: no toca ni relaja ningún paso existente.
      - name: Test frontend (vitest)
        run: nix develop --command sh -c "cd frontend && npm run test"

      # Userscript del flujo de depósito (Semana 8): área con verificación
      # propia, paso propio (AGENTS.md, "Protección del CI"). `npm test`
      # reconstruye el dist y corre el núcleo con node --test (jsdom fijada
      # por package-lock.json); el diff verifica que el dist commiteado no
      # quede desincronizado (mismo criterio que openapi_spec.json).
      # Aditivo: no toca ni relaja ningún paso existente.
      - name: Test userscript dspace-fill (node --test + drift del dist)
        run: |
          nix develop --command sh -c "cd tools/dspace-fill && npm ci && npm test"
          git diff --exit-code -- tools/dspace-fill/dist/ || (echo "Drift en dist/: reconstruir con 'npm run build' y commitear" && exit 1)

      # Ensayo general del flujo de ficha de depósito (hallazgo 16b):
      # la verificación más completa del PR — valida el doc bueno,
      # publica la ficha, corre el userscript contra el mock, verifica
      # el handle en el buzón y genera constancia + registro. El paso
      # es aditivo: no toca ni relaja ningún paso existente.
      - name: Ensayo general ficha-deposito (e2e jsdom)
        run: nix run .#test-ficha-deposito
