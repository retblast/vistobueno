# Título del trabajo (handover issue #4): el XPath buscaba el placeholder
# "título del trabajo" de las plantillas, que una tesis real no contiene
# (→ 0 nodos). Ahora se localiza el título como el primer párrafo no vacío
# tras la línea "ESCUELA PROFESIONAL" que no repite universidad/facultad/
# escuela/optar/tesis (perfil fijo del manual: Univ→Facultad/Escuela→Título).
# Se valida solo en la carátula (`contexto: caratula`).
- id: caratula_titulo_trabajo_tamano
  tipo: atributo_xml
  descripcion: Tamaño de letra del título del trabajo en carátula
  valor_esperado: 14pt
  severidad: warning
  ubicacion: Carátula, especificaciones (párr. 177)
