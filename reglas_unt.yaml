      'abcdefghijklmnopqrstuvwxyzáéíóúñü'), 'trujillo')]/w:pPr/w:jc
    atributo: '@w:val'
    comparacion: all_eq
    esperado: center
# Márgenes del cuerpo: se validan SOLO las secciones que rigen el cuerpo real
# (contexto `seccion_cuerpo`), y en las secciones landscape se normaliza la
# rotación que Word aplica (bottom<->left, top<->right): el empaste sigue en
# el mismo borde físico. Antes se validaba `all_eq` sobre TODAS las secciones
# con el valor OOXML crudo, y las secciones landscape (tablas anchas legítimas,
# incluso dentro del cuerpo, p. ej. OPERACIONALIZACIÓN) producían falsos
# positivos (handover issue #2). La política queda resuelta: se acepta la
# rotación estándar de Word; no se exige uniformidad fuera del cuerpo.
- id: margen_superior
  tipo: atributo_xml
  descripcion: Margen superior del documento
  valor_esperado: 2.5 cm
  severidad: error
  ubicacion: Sección "Formato general" (párr. 132-133)
  fuente: MANUAL REVISADO TERCERA VERSION OBSERVACIONES 11-07-2025.docx
  cita: '"Superior: 2.5 cm"'
  atributo_xml:
    parte: document
    contexto: seccion_cuerpo
    xpath: (//w:sectPr)/w:pgMar
    atributo: '@w:top'
    comparacion: all_eq
    esperado: '1418'
- id: margen_inferior
  tipo: atributo_xml
  descripcion: Margen inferior del documento
  valor_esperado: 2.5 cm
  severidad: error
  ubicacion: Sección "Formato general" (párr. 132-134)
  fuente: MANUAL REVISADO TERCERA VERSION OBSERVACIONES 11-07-2025.docx
  cita: '"Inferior: 2.5 cm"'
